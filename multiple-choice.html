<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiple Choice Practice - Year 11 Business Studies</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    --grad-start: #e8d5c4;
    --grad-mid: #ddd0e0;
    --grad-end: #c9cce8;
    --ink: #2d2535;
    --ink-soft: #5a5268;
    --ink-faint: #8a849a;
    --surface: rgba(255,255,255,0.88);
    --surface-border: rgba(255,255,255,0.65);
    --surface-raised: rgba(255,255,255,0.98);
    --accent: #8f8fc4;
    --accent-ink: #4c4a7a;
    --good: #5f8a63;
    --good-bg: rgba(95,138,99,0.12);
    --bad: #a85a72;
    --bad-bg: rgba(168,90,114,0.12);
    --focus-ring: #6b63a8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, var(--grad-start) 0%, var(--grad-mid) 50%, var(--grad-end) 100%);
    min-height: 100vh;
    line-height: 1.55;
  }

  a { color: inherit; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }

  .crumb {
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 1.75rem;
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }
  .crumb .sep { color: var(--ink-faint); }

  header.hero {
    text-align: center;
    margin-bottom: 2rem;
  }
  .eyebrow {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 0.6rem;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    margin: 0 0 0.5rem;
    text-wrap: balance;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 0.95rem;
    max-width: 46ch;
    margin: 0 auto;
  }

  .card {
    background: var(--surface);
    backdrop-filter: blur(10px);
    border: 1px solid var(--surface-border);
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(45,37,53,0.08);
    padding: 1.75rem;
  }

  /* ---- Set picker ---- */
  .set-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 0.85rem;
  }
  .set-btn {
    font-family: inherit;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 14px;
    padding: 1.1rem 0.9rem;
    text-align: left;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
    box-shadow: 0 2px 10px rgba(45,37,53,0.05);
  }
  .set-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(45,37,53,0.12); }
  .set-btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .set-name {
    font-weight: 700;
    font-size: 1.02rem;
    margin-bottom: 0.25rem;
  }
  .set-meta {
    font-size: 0.76rem;
    color: var(--ink-faint);
  }

  .sample-flag {
    font-size: 0.76rem;
    color: var(--accent-ink);
    background: rgba(143,143,196,0.14);
    border: 1px dashed rgba(143,143,196,0.45);
    border-radius: 10px;
    padding: 0.65rem 0.9rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  /* ---- Initials gate ---- */
  .gate-row {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    max-width: 320px;
    margin: 0 auto;
  }
  label.field-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  input.initials-input {
    font-family: inherit;
    font-size: 1.15rem;
    padding: 0.7rem 0.85rem;
    border-radius: 10px;
    border: 1.5px solid rgba(90,82,104,0.25);
    background: var(--surface-raised);
    color: var(--ink);
    text-align: center;
    letter-spacing: 0.02em;
  }
  input.initials-input:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .hint { font-size: 0.74rem; color: var(--ink-faint); text-align: center; }

  /* ---- Buttons ---- */
  .btn {
    font-family: inherit;
    font-weight: 700;
    font-size: 0.92rem;
    border: none;
    border-radius: 10px;
    padding: 0.75rem 1.4rem;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid rgba(90,82,104,0.25); }

  .actions { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.6rem; flex-wrap: wrap; }

  /* ---- Quiz ---- */
  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.1rem;
    font-size: 0.78rem;
    color: var(--ink-faint);
  }
  .progress-track {
    height: 6px;
    border-radius: 99px;
    background: rgba(90,82,104,0.15);
    overflow: hidden;
    margin-bottom: 1.6rem;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.25s ease;
  }

  .q-block { margin-bottom: 1.9rem; padding-bottom: 1.9rem; border-bottom: 1px solid rgba(90,82,104,0.12); }
  .q-block:last-of-type { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
  .q-num {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent-ink);
    margin-bottom: 0.35rem;
  }
  .q-context {
    font-size: 0.85rem;
    color: var(--ink-soft);
    background: rgba(90,82,104,0.07);
    border-left: 3px solid var(--accent);
    padding: 0.6rem 0.8rem;
    border-radius: 0 8px 8px 0;
    margin-bottom: 0.75rem;
    white-space: pre-line;
  }
  .q-image { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 0.75rem; border: 1px solid rgba(90,82,104,0.15); }
  .q-text {
    font-weight: 600;
    font-size: 1.02rem;
    margin-bottom: 0.85rem;
    text-wrap: balance;
  }
  .opt-list { display: flex; flex-direction: column; gap: 0.55rem; }
  .opt {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.7rem 0.9rem;
    border-radius: 10px;
    border: 1.5px solid rgba(90,82,104,0.2);
    background: var(--surface-raised);
    cursor: pointer;
    font-size: 0.92rem;
  }
  .opt:hover { border-color: var(--accent); }
  .opt input { accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
  .opt.chosen { border-color: var(--accent); background: rgba(143,143,196,0.12); }

  .opt.correct-answer { border-color: var(--good); background: var(--good-bg); }
  .opt.wrong-chosen { border-color: var(--bad); background: var(--bad-bg); }
  .opt input:disabled { cursor: default; }
  .opt.reviewed { cursor: default; }

  .tag {
    margin-left: auto;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.15rem 0.5rem;
    border-radius: 99px;
    white-space: nowrap;
  }
  .tag.good { background: var(--good); color: white; }
  .tag.bad { background: var(--bad); color: white; }

  .q-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 0.7rem;
    font-size: 0.7rem;
    color: var(--ink-faint);
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .q-footer a.flag-link {
    color: var(--ink-faint);
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 2px;
  }
  .q-footer a.flag-link:hover { color: var(--bad); }

  /* ---- Results ---- */
  .score-ring {
    width: 128px;
    height: 128px;
    margin: 0 auto 1rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: conic-gradient(var(--accent) calc(var(--pct) * 1%), rgba(90,82,104,0.14) 0);
  }
  .score-ring-inner {
    width: 102px;
    height: 102px;
    border-radius: 50%;
    background: var(--surface-raised);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-big { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.9rem; line-height: 1; }
  .score-small { font-size: 0.68rem; color: var(--ink-faint); margin-top: 0.15rem; }
  .result-headline { text-align: center; font-size: 0.95rem; color: var(--ink-soft); margin-bottom: 1.8rem; }

  footer.note {
    text-align: center;
    font-size: 0.76rem;
    color: var(--ink-faint);
    margin-top: 2rem;
  }

  /* ---- Teacher results view ---- */
  table.results-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.results-table th, table.results-table td {
    text-align: left;
    padding: 0.55rem 0.7rem;
    border-bottom: 1px solid rgba(90,82,104,0.15);
    font-variant-numeric: tabular-nums;
  }
  table.results-table th {
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 700;
  }
  .table-scroll { overflow-x: auto; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .stat-tile {
    background: var(--surface-raised);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    text-align: center;
  }
  .stat-num { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 1.5rem; }
  .stat-label { font-size: 0.68rem; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.05em; }

  .set-filter { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  .set-filter button {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.4rem 0.85rem;
    border-radius: 99px;
    border: 1.5px solid rgba(90,82,104,0.25);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .set-filter button.active { background: var(--ink); color: white; border-color: var(--ink); }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    .wrap { padding: 1.5rem 1rem 3rem; }
    .card { padding: 1.25rem; }
  }
</style>
</head>
<body>

  <div class="crumb" id="crumb"></div>

  <div id="app"></div>

  <footer class="note" id="footNote"></footer>
</div>

0 000", "$130 000"], "correct": 2, "originId": "set6", "originTitle": "Set 6", "originSource": "Moriah College 2006 Preliminary"}, {"q": "An executive summary is:", "context": null, "images": [], "options": ["A written statement for the executives of a business which outlines the organisational goals and objectives", "A statement outlining the purpose of a business report and the key recommendations", "The annual report by the executives which summarises the performance of a business", "A plan of the strategies a business will implement to achieve its goals"], "correct": 1, "originId": "set9", "originTitle": "Set 9", "originSource": "NSW Independent 2003 Preliminary"}, {"q": "Which of the following is an entitlement for a casual employee?", "context": null, "images": [], "options": ["Regular working hours", "Sick leave and maternity leave", "Holiday leave and long service leave", "Fair pay and safe working conditions"], "correct": 3, "originId": "set3", "originTitle": "Set 3", "originSource": "Macarthur Anglican 2017 Preliminary Yearly"}, {"q": "The Head of Engineering Services at Rail Infrastructure Corporation reports to:", "context": null, "images": [], "options": ["The Board of Directors", "The Chief Executive Officer", "Head Office", "The Heads of Department"], "correct": 1, "originId": "set11", "originTitle": "Set 11", "originSource": "Moriah College 2004 Year 11 Final Exam"}, {"q": "What is the debt to equity ratio of the Electronics outlet?", "context": "An Electronics outlet has assets to the value of $700 000 and liabilities valued at $310 000.", "images": [], "options": ["0.4:1", "2.3:1", "4.3:2", "0.8:1"], "correct": 1, "originId": "set4", "originTitle": "Set 4", "originSource": "NSW Independent 2007 Preliminary"}, {"q": "The business plan is important to business success because:", "context": null, "images": [], "options": ["Banks will not grant loans if there is no plan", "It enables the business to be proactive", "A mission statement is a legal requirement", "It enables management to avoid legal pitfalls"], "correct": 1, "originId": "set11", "originTitle": "Set 11", "originSource": "Moriah College 2004 Year 11 Final Exam"}, {"q": "The Owner's Equity of this business is:", "context": "Use the financial information for a business in the table below to answer Question 14.\nCurrent Assets $25 000, Non-Current Liabilities $20 000, Owner's Equity ?, Non-Current Assets $75 000, Current Liabilities $45 000.", "images": [], "options": ["$35 000", "$65 000", "$100 000", "$165 000"], "correct": 0, "originId": "set1", "originTitle": "Set 1", "originSource": "Shore 2022 Preliminary Yearly"}, {"q": "Nun Wong owns a successful computer software business. Her decision to buy out a competitor is an example of:", "context": null, "images": [], "options": ["Conglomerate integration", "Backward vertical integration", "Forward vertical integration", "Horizontal integration"], "correct": 3, "originId": "set9", "originTitle": "Set 9", "originSource": "NSW Independent 2003 Preliminary"}, {"q": "If The Towel Company sells 1000 units of beach towels it would be operating at a:", "context": "Use the following information to answer Questions 15 and 16.\nThe Towel Company sells beach towels for $60 per towel/unit. Fixed costs for The Towel Company are $5 000 and variable costs are $20 per towel/unit.", "images": [], "options": ["Breakeven", "$25 000 loss", "$35 000 profit", "$60 000 profit"], "correct": 2, "originId": "set1", "originTitle": "Set 1", "originSource": "Shore 2022 Preliminary Yearly"}, {"q": "Rail Infrastructure Corporation is organised on a:", "context": "The diagram (not reproduced here) shows Rail Infrastructure Corporation organised with a Board of Directors, a Chief Executive Officer, and separate Heads of Department for functions including Engineering, Finance and Human Resources.", "images": [], "options": ["Functional structure", "Customer structure", "Matrix structure", "Product structure"], "correct": 0, "originId": " <script>
(function () {
  "use strict";

  // Where flagged questions and finished-quiz results get emailed.
  const TEACHER_EMAIL = "michelle.perkins@spcc.nsw.edu.au";

  // Google Apps Script Web App URL for the leaderboard (Mrs Perkins' own
  // Google Sheet - students never see or touch this). Leaderboard features
  // quietly disable themselves until this is set to a real /exec URL.
  const LEADERBOARD_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
  const leaderboardEnabled = () => LEADERBOARD_URL.indexOf("PASTE_YOUR") !== 0;

  const QUIZ_SETS = JSON.parse(document.getElementById("quiz-data").textContent);

  const $app = document.getElementById("app");
  const $crumb = document.getElementById("crumb");

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else node.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => node.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
    return node;
  }

  function formatInitialsHint() {
    return "e.g. first initial + first letters of your surname - \"J.Smi\"";
  }

  const state = {
    view: "picker",
    setId: null,
    initials: "",
    answers: [],
    submitted: false
  };

  function getSet(id) { return QUIZ_SETS.find(s => s.id === id); }

  function renderCrumb() {
    $crumb.innerHTML = "";
    $crumb.appendChild(el("a", { href: "https://mrsperkinsteacher.github.io/" }, ["Home"]));
    $crumb.appendChild(el("span", { class: "sep" }, ["/"]));
    $crumb.appendChild(el("a", { href: "https://mrsperkinsteacher.github.io/business/" }, ["Business Studies"]));
    $crumb.appendChild(el("span", { class: "sep" }, ["/"]));
    $crumb.appendChild(el("a", { href: "https://mrsperkinsteacher.github.io/business/year11.html" }, ["Year 11"]));
    $crumb.appendChild(el("span", { class: "sep" }, ["/"]));
    $crumb.appendChild(el("span", {}, ["Multiple Choice"]));
  }

  function renderPicker() {
    $app.innerHTML = "";
    $app.appendChild(el("header", { class: "hero" }, [
      el("div", { class: "eyebrow" }, ["Year 11 · Business Studies"]),
      el("h1", {}, ["Multiple Choice Practice"]),
      el("p", { class: "sub" }, ["Questions pulled from real Preliminary trial exams and mixed across topics - pick a set to start. Each one marks itself the moment you submit, and your result goes straight to Mrs Perkins in Outlook."])
    ]));

    const card = el("div", { class: "card" });
    const grid = el("div", { class: "set-grid" });
    QUIZ_SETS.forEach(s => {
      const btn = el("button", { class: "set-btn" }, [
        el("div", { class: "set-name" }, [s.title]),
        el("div", { class: "set-meta" }, [s.questions.length + " questions · mixed topics"])
      ]);
      btn.addEventListener("click", () => {
        state.setId = s.id;
        state.answers = new Array(s.questions.length).fill(-1);
        state.submitted = false;
        state.view = "initials";
        render();
      });
      grid.appendChild(btn);
    });
    card.appendChild(grid);
    $app.appendChild(card);

    if (leaderboardEnabled()) {
      const lbRow = el("div", { class: "actions" });
      const lbBtn = el("button", { class: "btn btn-ghost" }, ["🏆 View leaderboard"]);
      lbBtn.addEventListener("click", () => { state.view = "leaderboard"; render(); });
      lbRow.appendChild(lbBtn);
      $app.appendChild(lbRow);
    }
  }

  function renderLeaderboard() {
    $app.innerHTML = "";
    $app.appendChild(el("header", { class: "hero" }, [
      el("div", { class: "eyebrow" }, ["Best score per student"]),
      el("h1", {}, ["Leaderboard"]),
      el("p", { class: "sub" }, ["Shown by initials only - each student's best attempt across every set."])
    ]));

    const card = el("div", { class: "card" });
    card.appendChild(el("p", { class: "hint" }, ["Loading..."]));
    $app.appendChild(card);

    const backBtn = el("button", { class: "btn btn-ghost" }, ["← All sets"]);
    backBtn.addEventListener("click", () => { state.view = "picker"; render(); });

    if (!leaderboardEnabled()) {
      card.innerHTML = "";
      card.appendChild(el("p", { class: "hint" }, ["The leaderboard isn't switched on yet."]));
      card.appendChild(el("div", { class: "actions" }, [backBtn]));
      return;
    }

    fetch(LEADERBOARD_URL)
      .then(r => r.json())
      .then(rows => {
        card.innerHTML = "";
        if (!rows.length) {
          card.appendChild(el("p", { class: "hint" }, ["No results yet - be the first!"]));
        } else {
          const table = el("table", { class: "results-table" });
          table.appendChild(el("thead", {}, [el("tr", {}, [
            el("th", {}, ["Rank"]), el("th", {}, ["Initials"]), el("th", {}, ["Best score"]), el("th", {}, ["Set"])
          ])]));
          const tbody = el("tbody");
          rows.forEach((r, i) => {
            const pct = Math.round((r.score / r.total) * 100);
            tbody.appendChild(el("tr", {}, [
              el("td", {}, [String(i + 1)]),
              el("td", {}, [r.initials]),
              el("td", {}, [r.score + "/" + r.total + " (" + pct + "%)"]),
              el("td", {}, [r.setTitle])
            ]));
          });
          table.appendChild(tbody);
          const scroll = el("div", { class: "table-scroll" }, [table]);
          card.appendChild(scroll);
        }
        card.appendChild(el("div", { class: "actions" }, [backBtn]));
      })
      .catch(() => {
        card.innerHTML = "";
        card.appendChild(el("p", { class: "hint" }, ["Couldn't load the leaderboard just now - try again shortly."]));
        card.appendChild(el("div", { class: "actions" }, [backBtn]));
      });
  }

  function renderInitialsGate() {
    const s = getSet(state.setId);
    $app.innerHTML = "";
    $app.appendChild(el("header", { class: "hero" }, [
      el("div", { class: "eyebrow" }, ["Before you start"]),
      el("h1", {}, [s.title])
    ]));

    const card = el("div", { class: "card" });
    const row = el("div", { class: "gate-row" });
    row.appendChild(el("label", { class: "field-label", for: "initialsField" }, ["Your initials"]));
    const input = el("input", { class: "initials-input", id: "initialsField", maxlength: "6", autocomplete: "off", placeholder: "J.Smi" });
    input.value = state.initials;
    row.appendChild(input);
    row.appendChild(el("div", { class: "hint" }, [formatInitialsHint()]));

    const startBtn = el("button", { class: "btn btn-primary" }, ["Start " + s.title]);
    const backBtn = el("button", { class: "btn btn-ghost" }, ["← All sets"]);

    function tryStart() {
      const v = input.value.trim();
      if (!v) { input.focus(); return; }
      state.initials = v;
      state.view = "quiz";
      render();
    }
    startBtn.addEventListener("click", tryStart);
    input.addEventListener("keydown", e => { if (e.key === "Enter") tryStart(); });
    backBtn.addEventListener("click", () => { state.view = "picker"; render(); });

    card.appendChild(row);
    card.appendChild(el("div", { class: "actions" }, [backBtn, startBtn]));
    $app.appendChild(card);
    setTimeout(() => input.focus(), 0);
  }

  // Opens Outlook's own web compose window, pre-filled, in a new tab.
  // This works on any device signed into a school Microsoft account -
  // unlike a mailto: link, it doesn't depend on a default mail app being
  // set up (most school Chromebooks/iPads don't have one configured).
  function outlookComposeLink(subject, body) {
    return "https://outlook.office.com/mail/deeplink/compose?to=" + encodeURIComponent(TEACHER_EMAIL) +
      "&subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  }

  function buildFlagLink(setTitle, qIndex, q) {
    const subject = "Question flag - " + setTitle + " Q" + (qIndex + 1);
    const body = "Set: " + setTitle + " (originally " + q.originTitle + ")\n" +
      "Question: " + q.q + "\n" +
      "Marked correct answer: " + q.options[q.correct] + "\n\n" +
      "What I think is wrong:\n";
    return outlookComposeLink(subject, body);
  }

  function buildResultsEmailLink(s, correct, total) {
    const pct = Math.round((correct / total) * 100);
    const subject = "MC result - " + state.initials + " - " + s.title + " (" + correct + "/" + total + ")";
    let body = "Student initials: " + state.initials + "\n" +
      "Set: " + s.title + "\n" +
      "Score: " + correct + "/" + total + " (" + pct + "%)\n\n";

    const missed = [];
    s.questions.forEach((q, qi) => {
      const chosen = state.answers[qi];
      if (chosen !== q.correct) {
        missed.push({
          num: qi + 1,
          origin: q.originTitle,
          chosenText: chosen === -1 ? "(no answer)" : q.options[chosen],
          correctText: q.options[q.correct]
        });
      }
    });

    if (missed.length) {
      body += "Questions missed:\n";
      missed.forEach(m => {
        body += "Q" + m.num + " (from " + m.origin + "): chose \"" + m.chosenText + "\" - correct was \"" + m.correctText + "\"\n";
      });
    } else {
      body += "All questions correct.\n";
    }

    return outlookComposeLink(subject, body);
  }

  // Fire-and-forget write to the leaderboard sheet. Uses text/plain as the
  // content type and mode:"no-cors" so the browser treats this as a simple
  // request - Apps Script doesn't handle CORS preflight requests, so this
  // is the reliable way to post to it from another origin. We can't read
  // a response back this way, which is fine since we don't need one.
  function postToLeaderboard(initials, setTitle, score, total) {
    if (!leaderboardEnabled()) return;
    fetch(LEADERBOARD_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ initials: initials, setTitle: setTitle, score: score, total: total })
    }).catch(() => {});
  }

  function renderQuestionBody(block, q) {
    if (q.context) block.appendChild(el("div", { class: "q-context" }, [q.context]));
    if (q.images && q.images.length) {
      q.images.forEach(src => block.appendChild(el("img", { class: "q-image", src: src, alt: "Question diagram" })));
    }
  }

  function renderQuiz() {
    const s = getSet(state.setId);
    $app.innerHTML = "";

    const answeredCount = state.answers.filter(a => a !== -1).length;
    const pct = Math.round((answeredCount / s.questions.length) * 100);

    $app.appendChild(el("header", { class: "hero" }, [
      el("div", { class: "eyebrow" }, [s.title + " · " + state.initials]),
      el("h1", {}, ["Answer every question"])
    ]));

    const card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "quiz-meta" }, [
      el("span", {}, [answeredCount + " of " + s.questions.length + " answered"]),
      el("span", {}, [pct + "%"])
    ]));
    const track = el("div", { class: "progress-track" });
    track.appendChild(el("div", { class: "progress-fill", style: "width:" + pct + "%" }));
    card.appendChild(track);

    s.questions.forEach((q, qi) => {
      const block = el("div", { class: "q-block" });
      block.appendChild(el("div", { class: "q-num" }, ["Question " + (qi + 1) + " of " + s.questions.length]));
      renderQuestionBody(block, q);
      block.appendChild(el("div", { class: "q-text" }, [q.q]));
      const optList = el("div", { class: "opt-list" });
      q.options.forEach((opt, oi) => {
        const id = "q" + qi + "_o" + oi;
        const label = el("label", { class: "opt" + (state.answers[qi] === oi ? " chosen" : ""), for: id });
        const radio = el("input", { type: "radio", name: "q" + qi, id: id });
        radio.checked = state.answers[qi] === oi;
        radio.addEventListener("change", () => {
          state.answers[qi] = oi;
          renderQuiz();
        });
        label.appendChild(radio);
        label.appendChild(document.createTextNode(opt));
        optList.appendChild(label);
      });
      block.appendChild(optList);
      block.appendChild(el("div", { class: "q-footer" }, [el("span", {}, ["From " + q.originTitle])]));
      card.appendChild(block);
    });

    const backBtn = el("button", { class: "btn btn-ghost" }, ["← All sets"]);
    backBtn.addEventListener("click", () => { state.view = "picker"; render(); });

    const submitBtn = el("button", { class: "btn btn-primary" }, ["Submit " + s.title]);
    submitBtn.disabled = answeredCount < s.questions.length;
    submitBtn.addEventListener("click", () => {
      state.submitted = true;
      state.view = "results";
      render();
    });

    card.appendChild(el("div", { class: "actions" }, [backBtn, submitBtn]));
    $app.appendChild(card);
  }

  function scoreFor(s) {
    let correct = 0;
    s.questions.forEach((q, qi) => { if (state.answers[qi] === q.correct) correct++; });
    return correct;
  }

  function renderResults() {
    const s = getSet(state.setId);
    const correct = scoreFor(s);
    const total = s.questions.length;
    const pct = Math.round((correct / total) * 100);

    $app.innerHTML = "";
    $app.appendChild(el("header", { class: "hero" }, [
      el("div", { class: "eyebrow" }, [s.title + " · " + state.initials]),
      el("h1", {}, ["Marked instantly"])
    ]));

    const card = el("div", { class: "card" });
    const ring = el("div", { class: "score-ring", style: "--pct:" + pct });
    ring.appendChild(el("div", { class: "score-ring-inner" }, [
      el("div", { class: "score-big" }, [correct + "/" + total]),
      el("div", { class: "score-small" }, [pct + "%"])
    ]));
    card.appendChild(ring);
    card.appendChild(el("p", { class: "result-headline" }, [
      pct === 100 ? "Perfect set - every answer correct." :
      pct >= 80 ? "Strong result - just a couple to review below." :
      pct >= 50 ? "Solid attempt - check the review below for the ones to revisit." :
      "Worth another pass - review each question below before trying again."
    ]));

    const resultsEmailLink = buildResultsEmailLink(s, correct, total);

    const sendNote = el("div", { class: "sample-flag" }, []);
    sendNote.appendChild(document.createTextNode("An Outlook tab should have just opened with your result ready to go - press Send in there so Mrs Perkins gets it. "));
    const resendLink = el("a", { href: resultsEmailLink, target: "_blank", rel: "noopener" }, ["Didn't open? Click here to send it →"]);
    sendNote.appendChild(resendLink);
    card.appendChild(sendNote);

    s.questions.forEach((q, qi) => {
      const chosen = state.answers[qi];
      const isRight = chosen === q.correct;
      const block = el("div", { class: "q-block" });
      block.appendChild(el("div", { class: "q-num" }, ["Question " + (qi + 1)]));
      renderQuestionBody(block, q);
      const qTextRow = el("div", { class: "q-text" }, [q.q + " "]);
      qTextRow.appendChild(el("span", { class: "tag " + (isRight ? "good" : "bad") }, [isRight ? "Correct" : "Incorrect"]));
      block.appendChild(qTextRow);
      const optList = el("div", { class: "opt-list" });
      q.options.forEach((opt, oi) => {
        let cls = "opt reviewed";
        if (oi === q.correct) cls += " correct-answer";
        else if (oi === chosen) cls += " wrong-chosen";
        const label = el("label", { class: cls });
        const radio = el("input", { type: "radio", disabled: "disabled" });
        radio.checked = oi === chosen;
        label.appendChild(radio);
        label.appendChild(document.createTextNode(opt));
        optList.appendChild(label);
      });
      block.appendChild(optList);
      const flagLink = el("a", { class: "flag-link", href: buildFlagLink(s.title, qi, q), target: "_blank", rel: "noopener" }, ["Think this is wrong? Email me →"]);
      block.appendChild(el("div", { class: "q-footer" }, [
        el("span", {}, ["From " + q.originTitle]),
        flagLink
      ]));
      card.appendChild(block);
    });

    const backBtn = el("button", { class: "btn btn-ghost" }, ["← All sets"]);
    backBtn.addEventListener("click", () => { state.view = "picker"; render(); });
    const retryBtn = el("button", { class: "btn btn-primary" }, ["Try " + s.title + " again"]);
    retryBtn.addEventListener("click", () => {
      state.answers = new Array(s.questions.length).fill(-1);
      state.submitted = false;
      state.view = "quiz";
      render();
    });
    card.appendChild(el("div", { class: "actions" }, [backBtn, retryBtn]));
    $app.appendChild(card);

    // Auto-open Outlook compose in a new tab with the result ready to send.
    // This runs inside the same click handler chain as the Submit button,
    // so browsers treat it as a genuine user-initiated action rather than
    // blocking it as a popup.
    window.open(resultsEmailLink, "_blank", "noopener");

    postToLeaderboard(state.initials, s.title, correct, total);
  }

  function render() {
    renderCrumb();
    if (state.view === "picker") renderPicker();
    else if (state.view === "initials") renderInitialsGate();
    else if (state.view === "quiz") renderQuiz();
    else if (state.view === "results") renderResults();
    else if (state.view === "leaderboard") renderLeaderboard();
  }

  render();
})();
</script>

</body>
</html>
